name: Build and publish Windows release

on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version and create release tag
        id: release-version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            EXISTING_COMMIT="$(git rev-list -n 1 "v$VERSION")"
            if ! git merge-base --is-ancestor "$EXISTING_COMMIT" "$CURRENT_COMMIT"; then
              echo "::error::Tag v$VERSION is not in the current main history"
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "EazySales v$VERSION"
          git push origin "v$VERSION"

  release:
    needs: create-tag
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      ((github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))) &&
      needs.create-tag.result == 'success'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && format('v{0}', needs.create-tag.outputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish one complete GitHub Release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $releases |
            Where-Object { $_.tag_name -eq $tag -and $_.draft } |
            ForEach-Object { gh api --method DELETE "repos/${{ github.repository }}/releases/$($_.id)" }
          gh release create $tag `
            "release/EazySales-Setup-$version.exe" `
            "release/EazySales-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            --title "EazySales $tag" `
            --generate-notes `
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
